<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背单词 · 光学专业词汇</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-front: #ffffff;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --green: #10b981;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 800px at 20% -10%, #1e1b4b 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 860px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 26px; letter-spacing: 1px; background: linear-gradient(90deg, #a5b4fc, #c4b5fd); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  /* 控制区 */
  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
  }
  .ctrl-group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ctrl-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .chip {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.good.active { background: var(--green); border-color: var(--green); }
  .chip.bad.active { background: var(--red); border-color: var(--red); }
  .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

  /* 统计 */
  .stats {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    margin-bottom: 16px; font-size: 13px; color: var(--muted);
  }
  .stats b { color: var(--text); }
  .progressbar { flex: 1; min-width: 140px; height: 8px; background: var(--card); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
  .progressbar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; border-radius: 99px; }

  /* 卡片 */
  .scene { perspective: 1200px; margin: 10px 0 18px; }
  .card {
    position: relative; width: 100%; min-height: 300px;
    transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.3,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 18px; border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 28px; text-align: center;
  }
  .face.front { background: var(--card-front); color: #0f172a; }
  .face.back { background: linear-gradient(135deg, #312e81, #4c1d95); transform: rotateY(180deg); color: #fff; }
  .word {
    font-size: clamp(26px, 5.5vw, 44px); font-weight: 700; line-height: 1.25; word-break: break-word;
  }
  .phonetic { font-size: 17px; color: #64748b; margin-top: 12px; font-family: "Segoe UI", "PingFang SC", sans-serif; word-break: break-word; }
  .face.back .word { font-size: clamp(24px, 4.5vw, 36px); }
  .hint { font-size: 12px; color: #94a3b8; margin-top: 18px; letter-spacing: 1px; }
  .group-tag { position: absolute; top: 16px; left: 18px; font-size: 11px; color: #94a3b8; }
  .group-tag.back { color: #c4b5fd; }
  .index-tag { position: absolute; top: 16px; right: 18px; font-size: 11px; color: #94a3b8; }

  .speak-btn {
    position: absolute; bottom: 16px; right: 16px;
    background: transparent; border: 1px solid #e2e8f0; color: #475569;
    border-radius: 999px; width: 40px; height: 40px; font-size: 18px; cursor: pointer;
    transition: all .15s;
  }
  .speak-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .speak-btn.back { border-color: rgba(255,255,255,.4); color: #fff; }

  /* 操作按钮 */
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 22px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform .08s, filter .15s; color: #fff;
  }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: var(--card); border: 1px solid var(--border); color: var(--text); }
  .btn.ghost:hover { border-color: var(--accent); }
  .btn.unknown { background: var(--red); }
  .btn.unknown:hover { filter: brightness(1.1); }
  .btn.known { background: var(--green); }
  .btn.known:hover { filter: brightness(1.1); }
  .btn.primary { background: var(--accent); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  #rareBtn.rare-active { background: #f59e0b; border-color: #f59e0b; }

  /* 测验选项 */
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .option {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; font-size: 16px; cursor: pointer; color: var(--text); text-align: left;
    transition: all .12s; word-break: break-word;
  }
  .option:hover { border-color: var(--accent); transform: translateY(-1px); }
  .option.correct { background: var(--green); border-color: var(--green); color: #fff; }
  .option.wrong { background: var(--red); border-color: var(--red); color: #fff; }
  .option:disabled { cursor: default; }

  /* 拼写 */
  .spell-row { display: flex; gap: 10px; margin: 16px 0; justify-content: center; align-items: center; }
  .spell-row input {
    flex: 1; max-width: 480px; background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 13px 16px; font-size: 18px; outline: none;
    transition: border-color .15s;
  }
  .spell-row input:focus { border-color: var(--accent); }
  .spell-row input.correct { border-color: var(--green); }
  .spell-row input.wrong { border-color: var(--red); }
  #spellFeedback { min-height: 26px; text-align: center; margin: 10px 0; font-size: 16px; }
  #spellFeedback .ok { color: var(--green); font-weight: 600; }
  #spellFeedback .no { color: var(--red); font-weight: 600; }
  #spellFeedback .ans { color: var(--muted); }
  @media (max-width: 560px) { .options { grid-template-columns: 1fr; } .sep { display: none; } }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 15px; }
  footer { text-align: center; color: #475569; font-size: 12px; margin-top: 40px; line-height: 1.7; }
  kbd { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>背单词 · 光学专业词汇</h1>
    <p>共 <span id="totalWords">0</span> 词 · 点击卡片翻面 · 支持键盘操作</p>
  </header>

  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">分组</span>
      <button class="chip active" data-group="all">全部</button>
      <div id="groupBtns" style="display:contents"></div>
    </div>
    <div class="sep"></div>
    <div class="ctrl-group">
      <span class="ctrl-label">方向</span>
      <button class="chip active" data-dir="en2cn">英 → 中</button>
      <button class="chip" data-dir="cn2en">中 → 英</button>
    </div>
    <div class="sep"></div>
    <div class="ctrl-group">
      <span class="ctrl-label">顺序</span>
      <button class="chip active" data-order="seq">顺序</button>
      <button class="chip" data-order="random">随机</button>
    </div>
    <div class="sep"></div>
    <div class="ctrl-group">
      <span class="ctrl-label">筛选</span>
      <button class="chip active" data-filter="all">全部</button>
      <button class="chip bad" data-filter="unknown">错题</button>
      <button class="chip" data-filter="unseen">未学</button>
      <button class="chip good" data-filter="known">已掌握</button>
      <button class="chip" data-filter="rare">生僻词</button>
    </div>
    <div class="sep"></div>
    <div class="ctrl-group">
      <span class="ctrl-label">模式</span>
      <button class="chip active" data-mode="study">卡片</button>
      <button class="chip" data-mode="quiz">测验</button>
      <button class="chip" data-mode="spell">拼写</button>
    </div>
    <button class="chip" id="resetBtn" title="清空学习进度">重置进度</button>
  </div>

  <div class="stats">
    <span>进度 <b id="doneCount">0</b>/<b id="deckSize">0</b></span>
    <div class="progressbar"><span id="progressFill" style="width:0%"></span></div>
    <span>掌握 <b id="knownCount" style="color:var(--green)">0</b></span>
    <span>待复习 <b id="unknownCount" style="color:var(--red)">0</b></span>
    <span>生僻 <b id="rareCount" style="color:#f59e0b">0</b></span>
  </div>

  <div id="studyArea">
    <div class="scene">
      <div class="card" id="card">
        <div class="face front" id="front">
          <div class="group-tag" id="frontGroup"></div>
          <div class="index-tag" id="indexTag"></div>
          <div class="word" id="frontWord"></div>
          <div class="phonetic" id="frontPhonetic"></div>
          <div class="hint">点击卡片 或 按空格翻面</div>
          <button class="speak-btn" id="speakFront" title="发音">🔊</button>
        </div>
        <div class="face back">
          <div class="group-tag back" id="backGroup"></div>
          <div class="index-tag" id="backIndex"></div>
          <div class="word" id="backWord"></div>
          <div class="phonetic" id="backPhonetic" style="color:#c4b5fd"></div>
          <button class="speak-btn back" id="speakBack" title="发音">🔊</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn ghost" id="prevBtn">← 上一个</button>
      <button class="btn unknown" id="unknownBtn">✗ 不认识</button>
      <button class="btn primary" id="flipBtn">翻面</button>
      <button class="btn known" id="knownBtn">✓ 认识</button>
      <button class="btn ghost" id="nextBtn">下一个 →</button>
      <button class="btn ghost" id="rareBtn">⭐ 生僻词</button>
    </div>
  </div>

  <div id="quizArea" style="display:none">
    <div class="scene" style="margin-bottom:0">
      <div class="card" id="quizCard" style="cursor:default">
        <div class="face front" style="position:static; inset:auto; transform:none; min-height:160px">
          <div class="group-tag" id="quizGroup"></div>
          <div class="word" id="quizPrompt"></div>
          <div class="phonetic" id="quizPhonetic"></div>
          <button class="speak-btn" id="quizSpeak" style="position:static; margin-top:14px">🔊</button>
        </div>
      </div>
    </div>
    <div class="options" id="options"></div>
    <div class="actions">
      <button class="btn ghost" id="quizNextBtn">下一题 →</button>
    </div>
  </div>

  <div id="spellArea" style="display:none">
    <div class="scene">
      <div class="card" style="cursor:default">
        <div class="face front" style="position:static; inset:auto; transform:none; min-height:180px">
          <div class="group-tag" id="spellGroup"></div>
          <div class="index-tag" id="spellIndex"></div>
          <div class="word" id="spellPrompt"></div>
          <button class="speak-btn" id="spellSpeak" style="position:static; margin-top:12px">🔊</button>
        </div>
      </div>
    </div>
    <div class="spell-row">
      <input id="spellInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="输入英文单词，按回车确认">
      <button class="btn primary" id="spellCheckBtn">检查</button>
    </div>
    <div id="spellFeedback"></div>
    <div class="actions">
      <button class="btn ghost" id="spellPrevBtn">← 上一个</button>
      <button class="btn ghost" id="spellNextBtn">下一个 →</button>
    </div>
  </div>

  <div class="empty" id="emptyMsg" style="display:none">该筛选条件下暂无单词，请调整上方条件。</div>

  <footer>
    空格 / Enter 翻面 · ← → 上下词 · <kbd>1</kbd> 认识 · <kbd>2</kbd> 不认识<br>
    进度自动保存在浏览器本地（localStorage），下次打开接着背。
  </footer>
</div>

/* ---------- 状态 ---------- */
const state = {
  group: 'all',
  direction: 'en2cn',
  order: 'seq',
  filter: 'all',
  mode: 'study',
  idx: 0,
};
let progress = loadProgress();
let rare = loadRare();

function loadProgress() {
  try { return JSON.parse(localStorage.getItem('vocab_progress') || '{}'); }
  catch (e) { return {}; }
}
function saveProgress() {
  localStorage.setItem('vocab_progress', JSON.stringify(progress));
}
function loadRare() {
  try { return new Set(JSON.parse(localStorage.getItem('vocab_rare') || '[]')); }
  catch (e) { return new Set(); }
}
function saveRare() {
  localStorage.setItem('vocab_rare', JSON.stringify([...rare]));
}
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 词表构建 ---------- */
function deck() {
  let list = WORDS.filter(w => state.group === 'all' || w.group === Number(state.group));
  if (state.filter === 'rare') {
    list = list.filter(w => rare.has(w.id));
  } else {
    list = list.filter(w => !rare.has(w.id));
    if (state.filter === 'unknown') list = list.filter(w => progress[w.id] === 'unknown');
    else if (state.filter === 'known') list = list.filter(w => progress[w.id] === 'known');
    else if (state.filter === 'unseen') list = list.filter(w => !(w.id in progress));
  }
  if (state.order === 'random') list = shuffle(list);
  return list;
}

/* ---------- 发音 ---------- */
function speak(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[/（）()\[\]]/g, ' '));
    u.lang = 'en-US';
    u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- 渲染控制 ---------- */
const $ = s => document.querySelector(s);

function buildGroups() {
  const names = [];
  WORDS.forEach(w => { if (!names.some(g => g.id === w.group)) names.push({ id: w.group, name: w.groupName }); });
  const box = $('#groupBtns');
  box.innerHTML = '';
  names.forEach(g => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.group = g.id;
    b.textContent = `${g.id} ${g.name}`;
    box.appendChild(b);
  });
}

/* ---------- 主渲染 ---------- */
let curDeck = [];
let flipped = false;

function render() {
  curDeck = deck();
  if (state.idx >= curDeck.length) state.idx = 0;
  if (state.idx < 0) state.idx = Math.max(0, curDeck.length - 1);

  const total = curDeck.length;
  const done = Object.keys(progress).filter(id => curDeck.some(w => w.id === Number(id))).length;
  const known = curDeck.filter(w => progress[w.id] === 'known').length;
  const unknown = curDeck.filter(w => progress[w.id] === 'unknown').length;

  const rareTotal = (state.group === 'all' ? WORDS : WORDS.filter(w => w.group === Number(state.group))).filter(w => rare.has(w.id)).length;
  $('#totalWords').textContent = WORDS.length;
  $('#deckSize').textContent = total;
  $('#doneCount').textContent = done;
  $('#knownCount').textContent = known;
  $('#unknownCount').textContent = unknown;
  $('#rareCount').textContent = rareTotal;
  $('#progressFill').style.width = total ? (done / total * 100).toFixed(1) + '%' : '0%';

  const empty = total === 0;
  $('#emptyMsg').style.display = empty ? '' : 'none';
  $('#studyArea').style.display = (!empty && state.mode === 'study') ? '' : 'none';
  $('#quizArea').style.display = (!empty && state.mode === 'quiz') ? '' : 'none';
  $('#spellArea').style.display = (!empty && state.mode === 'spell') ? '' : 'none';

  if (empty) return;

  if (state.mode === 'study') renderStudy();
  else if (state.mode === 'quiz') renderQuiz();
  else renderSpell();
}

function renderStudy() {
  const w = curDeck[state.idx];
  flipped = false;
  $('#card').classList.remove('flipped');
  $('#rareBtn').textContent = rare.has(w.id) ? '⭐ 取消生僻' : '⭐ 生僻词';
  $('#rareBtn').classList.toggle('rare-active', rare.has(w.id));
  const front = state.direction === 'en2cn' ? w.english : w.chinese;
  const frontPhon = state.direction === 'en2cn' ? w.phonetic : '';
  const back = state.direction === 'en2cn' ? w.chinese : w.english;
  const backPhon = state.direction === 'en2cn' ? '' : w.phonetic;

  $('#frontGroup').textContent = `第${w.group}组 · ${w.groupName}`;
  $('#backGroup').textContent = `第${w.group}组 · ${w.groupName}`;
  $('#indexTag').textContent = `${state.idx + 1}/${curDeck.length}`;
  $('#backIndex').textContent = `${state.idx + 1}/${curDeck.length}`;
  $('#frontWord').textContent = front;
  $('#frontPhonetic').textContent = frontPhon;
  $('#backWord').textContent = back;
  $('#backPhonetic').textContent = backPhon;
}

function renderQuiz() {
  const w = curDeck[state.idx];
  const prompt = state.direction === 'en2cn' ? w.english : w.chinese;
  const promptPhon = state.direction === 'en2cn' ? w.phonetic : '';
  $('#quizGroup').textContent = `第${w.group}组 · ${w.groupName}`;
  $('#quizPrompt').textContent = prompt;
  $('#quizPhonetic').textContent = promptPhon;

  // 生成选项
  const answerKey = state.direction === 'en2cn' ? 'chinese' : 'english';
  const correct = w[answerKey];
  const pool = curDeck.map(x => x[answerKey]).filter(v => v && v !== correct);
  const opts = shuffle(pool).slice(0, 3);
  opts.push(correct);
  const shuffled = shuffle(opts);

  const box = $('#options');
  box.innerHTML = '';
  shuffled.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.onclick = () => answer(b, opt === correct, w);
    box.appendChild(b);
  });
}

function answer(btn, isCorrect, w) {
  [...document.querySelectorAll('.option')].forEach(o => o.disabled = true);
  if (isCorrect) {
    btn.classList.add('correct');
    if (progress[w.id] !== 'known') { progress[w.id] = 'known'; saveProgress(); }
  } else {
    btn.classList.add('wrong');
    if (progress[w.id] !== 'unknown') { progress[w.id] = 'unknown'; saveProgress(); }
    document.querySelectorAll('.option').forEach(o => {
      if (o.textContent === (state.direction === 'en2cn' ? w.chinese : w.english)) o.classList.add('correct');
    });
  }
  setTimeout(() => nextWord(), 900);
}

/* ---------- 拼写模式 ---------- */
function acceptableAnswers(w) {
  return w.english.split(/[\/,；;]/).map(p =>
    p.replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '').trim().toLowerCase().replace(/\s+/g, ' ')
  ).filter(Boolean);
}
function normalizeSpell(s) {
  return s.toLowerCase().replace(/[，,;；.。!！?？:：]/g, '').replace(/\s+/g, ' ').trim();
}
function checkSpell(user, w) {
  const u = normalizeSpell(user);
  return acceptableAnswers(w).some(a => {
    const na = normalizeSpell(a);
    if (u === na) return true;
    if (na.includes('-') || u.includes('-')) return u.replace(/[-\s]/g, '') === na.replace(/[-\s]/g, '');
    return false;
  });
}
function renderSpell() {
  const w = curDeck[state.idx];
  $('#spellGroup').textContent = `第${w.group}组 · ${w.groupName}`;
  $('#spellIndex').textContent = `${state.idx + 1}/${curDeck.length}`;
  $('#spellPrompt').textContent = w.chinese;
  const inp = $('#spellInput');
  inp.value = '';
  inp.className = '';
  inp.disabled = false;
  $('#spellFeedback').innerHTML = '';
  setTimeout(() => inp.focus(), 50);
}
function submitSpell() {
  if (state.mode !== 'spell' || !curDeck.length) return;
  const w = curDeck[state.idx];
  const inp = $('#spellInput');
  const val = inp.value.trim();
  if (!val) return;
  if (checkSpell(val, w)) {
    progress[w.id] = 'known'; saveProgress();
    inp.className = 'correct';
    inp.disabled = true;
    $('#spellFeedback').innerHTML = '<span class="ok">✓ 拼写正确！</span>';
    setTimeout(() => nextWord(), 800);
  } else {
    progress[w.id] = 'unknown'; saveProgress();
    inp.className = 'wrong';
    const show = acceptableAnswers(w).join(' / ');
    $('#spellFeedback').innerHTML = `<span class="no">✗ 不对，正确答案：</span><span class="ans">${show} ${w.phonetic}</span>`;
  }
}

/* ---------- 交互 ---------- */
function nextWord() {
  if (!curDeck.length) return;
  state.idx = (state.idx + 1) % curDeck.length;
  render();
}
function prevWord() {
  if (!curDeck.length) return;
  state.idx = (state.idx - 1 + curDeck.length) % curDeck.length;
  render();
}
function mark(status) {
  if (state.mode !== 'study' || !curDeck.length) return;
  const w = curDeck[state.idx];
  progress[w.id] = status;
  saveProgress();
  nextWord();
}
function toggleRare() {
  if (state.mode !== 'study' || !curDeck.length) return;
  const w = curDeck[state.idx];
  if (rare.has(w.id)) rare.delete(w.id); else rare.add(w.id);
  saveRare();
  render();
}
function flip() {
  if (state.mode === 'study' && curDeck.length) {
    flipped = !flipped;
    $('#card').classList.toggle('flipped', flipped);
  }
}

/* ---------- 事件绑定 ---------- */
document.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (!c) return;
  if (c.dataset.group !== undefined) {
    state.group = c.dataset.group; state.idx = 0;
    document.querySelectorAll('[data-group]').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  } else if (c.dataset.dir) {
    state.direction = c.dataset.dir; state.idx = 0;
    document.querySelectorAll('[data-dir]').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  } else if (c.dataset.order) {
    state.order = c.dataset.order; state.idx = 0;
    document.querySelectorAll('[data-order]').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  } else if (c.dataset.filter) {
    state.filter = c.dataset.filter; state.idx = 0;
    document.querySelectorAll('[data-filter]').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  } else if (c.dataset.mode) {
    state.mode = c.dataset.mode; state.idx = 0;
    document.querySelectorAll('[data-mode]').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
  }
  render();
});

$('#card').addEventListener('click', e => { if (!e.target.closest('.speak-btn')) flip(); });
$('#flipBtn').addEventListener('click', flip);
$('#prevBtn').addEventListener('click', prevWord);
$('#nextBtn').addEventListener('click', nextWord);
$('#knownBtn').addEventListener('click', () => mark('known'));
$('#unknownBtn').addEventListener('click', () => mark('unknown'));
$('#rareBtn').addEventListener('click', toggleRare);
$('#quizNextBtn').addEventListener('click', nextWord);
$('#speakFront').addEventListener('click', e => { e.stopPropagation(); speak($('#frontWord').textContent); });
$('#speakBack').addEventListener('click', e => { e.stopPropagation(); speak($('#backWord').textContent); });
$('#quizSpeak').addEventListener('click', () => speak($('#quizPrompt').textContent));
$('#spellCheckBtn').addEventListener('click', submitSpell);
$('#spellInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitSpell(); });
$('#spellPrevBtn').addEventListener('click', prevWord);
$('#spellNextBtn').addEventListener('click', nextWord);
$('#spellSpeak').addEventListener('click', () => { const w = curDeck[state.idx]; if (w) speak(w.english); });

$('#resetBtn').addEventListener('click', () => {
  if (confirm('确定清空所有学习进度吗？')) {
    progress = {};
    rare = new Set();
    saveProgress();
    saveRare();
    state.idx = 0;
    render();
  }
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight') nextWord();
  else if (e.code === 'ArrowLeft') prevWord();
  else if (e.code === 'Digit1' || e.code === 'Numpad1') mark('known');
  else if (e.code === 'Digit2' || e.code === 'Numpad2') mark('unknown');
});

/* ---------- 启动 ---------- */
buildGroups();
render();
</script>
</body>
</html>
